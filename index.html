<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>市町村クイズ</title>
<meta name="theme-color" content="#18212b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="市町村クイズ">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-180.png">

<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;background:#f4f6f8;color:#18212b}
.app{max-width:620px;margin:auto;min-height:100vh;padding:18px 16px 90px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
h1{font-size:24px;margin:0}.sub{color:#687584;font-size:13px;margin-top:3px}
button{border:0;border-radius:14px;padding:13px 16px;font-size:16px;font-weight:700;background:#18212b;color:white}
button.secondary{background:white;color:#18212b;border:1px solid #d8dee5}
button:active{transform:scale(.98)}
.card{background:white;border-radius:22px;padding:20px;box-shadow:0 5px 22px #0000000c;margin-bottom:14px}
.menu button{width:100%;margin:7px 0;text-align:left}
.menu .big{padding:18px}.badge{display:inline-block;background:#eef2f6;border-radius:99px;padding:5px 9px;font-size:12px;margin-bottom:9px}
.progress{height:8px;background:#e7ebef;border-radius:99px;overflow:hidden;margin:10px 0 18px}.progress i{display:block;height:100%;background:#18212b}
.question{text-align:center;font-size:38px;font-weight:800;margin:32px 0}
input{width:100%;font-size:20px;padding:15px;border:2px solid #dce2e8;border-radius:14px;text-align:center;outline:0}input:focus{border-color:#18212b}
.feedback{text-align:center;padding:14px;border-radius:14px;margin:12px 0;font-weight:700}.ok{background:#e9f8ef;color:#17733e}.ng{background:#fff0f0;color:#a62b2b}
.row{display:flex;gap:8px}.row button{flex:1}.muted{color:#71808e;font-size:13px}.stat{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #edf0f3}.stat:last-child{border:0}
.item{padding:13px 0;border-bottom:1px solid #edf0f3}.item:last-child{border:0}.wrong{color:#b02a2a}.right{color:#17733e}
.hidden{display:none!important}
select{width:100%;padding:14px;border-radius:13px;border:1px solid #dce2e8;font-size:16px}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice-grid button{text-align:center;background:#fff;color:#18212b;border:1px solid #d8dee5}
.choice-grid button.selected{background:#18212b;color:white}
.small{font-size:13px}
</style>
</head>
<body>
<div class="app">
<header><div><h1>🇯🇵 市町村クイズ</h1><div class="sub">日本全国の市町村を覚えよう</div></div><button class="secondary" onclick="home()">ホーム</button></header>
<div id="screen"></div>
</div>
<script>
const DATA={
市:[
["札幌市","北海道"],["函館市","北海道"],["旭川市","北海道"],["青森市","青森県"],["盛岡市","岩手県"],
["仙台市","宮城県"],["秋田市","秋田県"],["山形市","山形県"],["福島市","福島県"],["水戸市","茨城県"],
["宇都宮市","栃木県"],["前橋市","群馬県"],["さいたま市","埼玉県"],["千葉市","千葉県"],["東京23区","東京都"],
["横浜市","神奈川県"],["川崎市","神奈川県"],["相模原市","神奈川県"],["新潟市","新潟県"],["富山市","富山県"],
["金沢市","石川県"],["福井市","福井県"],["甲府市","山梨県"],["長野市","長野県"],["岐阜市","岐阜県"],
["静岡市","静岡県"],["浜松市","静岡県"],["名古屋市","愛知県"],["津市","三重県"],["大津市","滋賀県"],
["京都市","京都府"],["大阪市","大阪府"],["神戸市","兵庫県"],["奈良市","奈良県"],["和歌山市","和歌山県"],
["鳥取市","鳥取県"],["松江市","島根県"],["岡山市","岡山県"],["広島市","広島県"],["山口市","山口県"],
["徳島市","徳島県"],["高松市","香川県"],["松山市","愛媛県"],["高知市","高知県"],["福岡市","福岡県"],
["佐賀市","佐賀県"],["長崎市","長崎県"],["熊本市","熊本県"],["大分市","大分県"],["宮崎市","宮崎県"],["鹿児島市","鹿児島県"],["那覇市","沖縄県"],
],
町村:[
["湯河原町","神奈川県"],["箱根町","神奈川県"],["葉山町","神奈川県"],["大磯町","神奈川県"],
["軽井沢町","長野県"],["白馬村","長野県"],["東神楽町","北海道"],["ニセコ町","北海道"],
["奥入瀬町","青森県"],["蔵王町","宮城県"],["那須町","栃木県"],["嬬恋村","群馬県"],
["富士河口湖町","山梨県"],["南伊豆町","静岡県"],["白川村","岐阜県"],["高山町","鹿児島県"],
["有田町","佐賀県"],["波佐見町","長崎県"],["阿蘇村","熊本県"],["読谷村","沖縄県"]
]};
let state=JSON.parse(localStorage.getItem("muniQuiz")||'{"history":[]}');
let quiz={type:null,items:[],i:0,correct:0,answered:false};

function save(){localStorage.setItem("muniQuiz",JSON.stringify(state))}
function home(){
 document.getElementById("screen").innerHTML=`
 <div class="card"><span class="badge">LEVEL 1</span><h2>都道府県を当てる</h2><p class="muted">市と町村を分けて、自分で都道府県を入力します。</p>
 <div class="menu">
 <button class="big" onclick="start('市')">🏙️ 市クイズ</button>
 <button class="big" onclick="start('町村')">🏘️ 町村クイズ</button>
 <button class="big" onclick="review()">❌ 間違えた問題だけ</button>
 </div></div>
 <div class="card"><h3>あなたの記録</h3>
 <div class="stat"><span>出題済み</span><b>${new Set(state.history.map(x=>x.key)).size} 問</b></div>
 <div class="stat"><span>正解</span><b>${state.history.filter(x=>x.ok).length} 回</b></div>
 <div class="stat"><span>不正解</span><b>${state.history.filter(x=>!x.ok).length} 回</b></div>
 <div class="stat"><span>間違えた市町村</span><b>${wrongKeys().length} 問</b></div>
 </div>
 <div class="card"><button class="secondary" style="width:100%" onclick="historyPage()">📖 出題履歴を見る</button></div>`;
}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function start(type){
 let arr=shuffle(DATA[type]);
 quiz={type,items:arr,i:0,correct:0,answered:false};
 renderQ();
}
function wrongKeys(){
 return [...new Set(state.history.filter(x=>!x.ok).map(x=>x.key))];
}
function review(){
 let keys=new Set(wrongKeys());
 let arr=[];
 for(let type of ["市","町村"]) for(let x of DATA[type]) if(keys.has(type+"|"+x[0])) arr.push({...x,type});
 if(!arr.length){alert("まだ間違えた問題がありません！");return}
 quiz={type:"復習",items:shuffle(arr).map(x=>[x[0],x[1],x.type]),i:0,correct:0,answered:false};
 renderQ();
}
function renderQ(){
 let x=quiz.items[quiz.i], name=x[0], pref=x[1], type=quiz.type==="復習"?x[2]:quiz.type;
 document.getElementById("screen").innerHTML=`
 <div class="card"><div class="small">${quiz.type==="復習"?"❌ 間違い復習":"LEVEL 1"}　${type}　${quiz.i+1}/${quiz.items.length}</div>
 <div class="progress"><i style="width:${(quiz.i/quiz.items.length)*100}%"></i></div>
 <div class="question">${name}</div>
 <input id="answer" placeholder="都道府県を入力" autocomplete="off">
 <div class="feedback hidden" id="fb"></div>
 <div class="row"><button onclick="answer()">回答する</button><button class="secondary" onclick="home()">終了</button></div>
 </div>`;
 document.getElementById("answer").focus();
 document.getElementById("answer").addEventListener("keydown",e=>{if(e.key==="Enter")answer()});
 quiz.answered=false;
}
function norm(s){return s.replace(/\s/g,"").replace(/　/g,"").trim()}
function answer(){
 if(quiz.answered)return;
 let input=norm(document.getElementById("answer").value);
 if(!input){alert("都道府県を入力してください");return}
 let x=quiz.items[quiz.i], name=x[0], pref=x[1], type=quiz.type==="復習"?x[2]:quiz.type;
 let ok=norm(input)===norm(pref);
 quiz.answered=true;if(ok)quiz.correct++;
 state.history.push({key:type+"|"+name,name,pref,type,answer:input,ok,at:new Date().toISOString()});save();
 let fb=document.getElementById("fb");fb.classList.remove("hidden","ok","ng");fb.classList.add(ok?"ok":"ng");
 fb.textContent=ok?"🎉 正解！":"❌ 不正解　正解は「"+pref+"」";
 document.getElementById("answer").disabled=true;
 setTimeout(()=>{quiz.i++; if(quiz.i>=quiz.items.length) finish(); else renderQ()},700);
}
function finish(){
 document.getElementById("screen").innerHTML=`<div class="card" style="text-align:center"><div style="font-size:48px">🎉</div><h2>クイズ終了！</h2>
 <p style="font-size:22px;font-weight:800">${quiz.correct} / ${quiz.items.length} 正解</p>
 <p class="muted">間違えた問題は「間違えた問題だけ」から復習できます。</p>
 <button onclick="home()">ホームへ戻る</button></div>`;
}
function historyPage(){
 let h=[...state.history].reverse();
 document.getElementById("screen").innerHTML=`<div class="card"><h2>📖 出題履歴</h2><p class="muted">これまでに解いた問題です。</p>${h.length?h.map(x=>`<div class="item"><b class="${x.ok?"right":"wrong"}">${x.ok?"✓":"✕"} ${x.name}</b><br><span class="muted">${x.type} → ${x.pref}　（回答：${x.answer}）</span></div>`).join(""):'<p>まだ問題を解いていません。</p>'}</div>
 <div class="row"><button onclick="review()">間違いだけ復習</button><button class="secondary" onclick="home()">戻る</button></div>`;
}
home();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
</script>

</body>
</html>
